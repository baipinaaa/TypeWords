[package]
name = "typewords"
version = "1.0.0"
description = "TypeWords - 打字背单词 桌面版"
authors = ["TypeWords"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "typewords_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
